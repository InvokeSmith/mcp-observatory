name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      # The eight constraints are the thing this project promises. Running them as their own step
      # means a break shows up as "constraints failed" in the checks list rather than buried in a
      # general test run.
      - name: Constraints
        run: bun test tests/constraints/
